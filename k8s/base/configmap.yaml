apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-config
  namespace: togglemaster
data:
  AWS_REGION: us-east-1
  # DNS interno dos Services ClusterIP (porta 80 -> porta do contêiner)
  AUTH_SERVICE_URL: http://auth-service
  FLAG_SERVICE_URL: http://flag-service
  TARGETING_SERVICE_URL: http://targeting-service
  AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
