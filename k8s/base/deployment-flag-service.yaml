apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
  labels: { app: flag-service, app.kubernetes.io/part-of: togglemaster }
spec:
  replicas: 2
  selector:
    matchLabels: { app: flag-service }
  template:
    metadata:
      labels: { app: flag-service, app.kubernetes.io/part-of: togglemaster }
    spec:
      serviceAccountName: togglemaster-app
      # Os serviços oficiais não criam as tabelas: o init.sql roda antes da app (idempotente).
      initContainers:
        - name: db-init
          image: postgres:16-alpine
          command: ["sh", "-c", "psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /sql/flags-init.sql"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: togglemaster-runtime, key: FLAGS_DATABASE_URL } }
          volumeMounts:
            - { name: sql, mountPath: /sql }
      volumes:
        - name: sql
          configMap: { name: togglemaster-sql, defaultMode: 0755 }
      containers:
        - name: flag-service
          image: togglemaster/flag-service:latest
          ports:
            - { name: http, containerPort: 8002 }
          envFrom:
            - configMapRef: { name: togglemaster-config }
          env:
            - { name: PORT, value: "8002" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: togglemaster-runtime, key: FLAGS_DATABASE_URL } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
